services:
  mould-inspect:
    build: .
    image: mould-inspect:1.0.0
    container_name: mould-inspect
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # 分级标准热加载：改完 grading.yaml 无需重启容器
      - ./config:/app/config:ro
    # 模型跑在宿主机（vLLM 等）时，.env 里用 http://host.docker.internal:8100/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

