services:
  mould-inspect:
    build: .
    image: mould-inspect:1.0.0
    container_name: mould-inspect
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Grading criteria reload without restarting the container.
      - ./config:/app/config:ro
    # For a model on the Docker host, set LLM_BASE_URL=http://host.docker.internal:8100/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"

